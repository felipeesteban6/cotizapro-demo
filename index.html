<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CotizaPro — Prototipo interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
body.phone{background:#D0D5DD;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
body.phone #app{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(16,24,40,.35);background:#F6F7F9}

.app{font-family:Inter,system-ui,sans-serif;color:#101828;background:#F6F7F9;font-size:14px;line-height:1.4;position:relative}
.app *{box-sizing:border-box}
.d .mOnly,.m .dOnly{display:none!important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ics{width:17px;height:17px}
.h1{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:28px;font-weight:700;letter-spacing:-.01em}
.m .h1{font-size:22px}
.h2{margin:0;font-size:16px;font-weight:600}
.sub{margin:0;color:#475467}
.mut{color:#475467}
.sm{font-size:12px}
.b5{font-weight:500}.b6{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.col2{display:flex;flex-direction:column;gap:2px;min-width:0}
.gap20{gap:20px}
.card{background:#fff;border:1px solid #E4E7EC;border-radius:12px}
.pad{padding:20px}
.m .pad{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #D0D5DD;background:#fff;color:#344054;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#F9FAFB}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pri{background:var(--a);border-color:var(--a);color:#fff}
.pri:hover{background:var(--a);filter:brightness(.92)}
.dng{color:#B42318;border-color:#FDA29B}
.ok{background:#067647;border-color:#067647;color:#fff}.ok:hover{background:#067647;filter:brightness(.92)}
.rej{background:#B42318;border-color:#B42318;color:#fff}.rej:hover{background:#B42318;filter:brightness(.92)}
.ghost{border-color:transparent;background:transparent}
.icb{width:40px;height:40px;min-height:40px;padding:0;border:0;background:transparent;color:#475467}
.link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--a);cursor:pointer;text-align:left;text-decoration:none}
.link:hover{text-decoration:underline}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#344054;min-width:0}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid #D0D5DD;border-radius:8px;background:#fff;font:inherit;font-size:14px;color:#101828}
.m .inp{font-size:16px}
.inp:focus{outline:2px solid var(--a);outline-offset:-1px;border-color:var(--a)}
textarea.inp{padding:10px 12px;resize:vertical}
.inperr{border-color:#D92D20}
.err{color:#B42318;font-size:12px;font-weight:500}
.okm{color:#067647;font-size:12px;font-weight:500}
.warn{display:flex;gap:8px;padding:10px 12px;border-radius:8px;background:#FFFAEB;color:#93370D;font-size:13px}
.info{padding:10px 12px;border-radius:8px;background:#F2F4F7;color:#344054;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.m .grid2{grid-template-columns:minmax(0,1fr)}
.g2k{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.m .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px}
.m .kpi{padding:12px}
.kv{font-family:'Space Grotesk',Inter,sans-serif;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.m .kv{font-size:18px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-borrador{background:#F2F4F7;color:#344054}.b-enviada{background:#EFF8FF;color:#175CD3}.b-visualizada{background:#F4F3FF;color:#5925DC}.b-aceptada{background:#ECFDF3;color:#067647}.b-rechazada{background:#FEF3F2;color:#B42318}.b-vencida{background:#FFFAEB;color:#B54708}.b-pendiente{background:#fff;color:#344054;border:1px dashed #98A2B3}.b-on{background:#ECFDF3;color:#067647}.b-off{background:#F2F4F7;color:#475467}
.shell{display:flex;min-height:inherit}
.m .shell{flex-direction:column;height:100%}
.side{width:248px;flex:none;background:#fff;border-right:1px solid #E4E7EC;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:19px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#344054;cursor:pointer;text-align:left}
.nav:hover{background:#F9FAFB}
.navon,.navon:hover{background:#EEF0FF;color:var(--a);font-weight:600}
.navh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475467;padding:14px 12px 4px}
.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.m .mainw{overflow-y:auto}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 24px;background:#101828;color:#fff;font-size:13px}
.demo select{min-height:32px;border-radius:6px;border:1px solid #475467;background:#1D2939;color:#fff;font:inherit;font-size:13px;padding:0 6px}
.demo .dl{background:transparent;border:1px solid #475467;color:#fff;border-radius:6px;min-height:32px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.top{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 32px 0;position:relative}
.m .top{justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid #E4E7EC}
.main{padding:14px 32px 40px;display:flex;flex-direction:column;gap:20px}
.m .main{padding:16px 14px 28px;gap:14px}
.bell{position:relative}
.dot{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#D92D20;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pop{position:absolute;top:56px;right:24px;width:360px;max-width:calc(100% - 24px);z-index:30;box-shadow:0 12px 32px rgba(16,24,40,.16)}
.m .pop{right:12px}
.bnav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1px solid #E4E7EC}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:transparent;font:inherit;font-size:11px;font-weight:500;color:#475467;cursor:pointer}
.bnon{color:var(--a);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #E4E7EC}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#475467;cursor:pointer;white-space:nowrap}
.tabon{border-bottom-color:var(--a);color:var(--a);font-weight:600}
.cnt{padding:1px 8px;border-radius:999px;background:#F2F4F7;color:#344054;font-size:12px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fg{flex:2 1 240px}.f1{flex:1 1 150px}
.m .fg,.m .f1{flex:1 1 100%}
.tw{overflow-x:auto}
.d .tbl{min-width:860px}
.tr{display:grid;gap:12px;align-items:center;padding:11px 20px;border-top:1px solid #F2F4F7}
.m .tr{padding:12px 14px}
.thd{background:#F9FAFB;color:#475467;font-size:12px;font-weight:600;border-top:0}
.tq{grid-template-columns:118px minmax(0,2fr) 92px 92px minmax(0,1fr) 110px 106px 124px}
.tc{grid-template-columns:minmax(0,2fr) 112px minmax(0,1fr) minmax(0,1.3fr) 110px 84px 96px}
.tp{grid-template-columns:90px minmax(0,2fr) minmax(0,1fr) 90px 80px 104px 84px 96px}
.tu{grid-template-columns:minmax(0,2fr) 170px 96px 118px}
.tr2{grid-template-columns:minmax(0,1fr) 70px 120px}
.m .tq,.m .tc,.m .tp,.m .tu{grid-template-columns:minmax(0,1fr) auto}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #E4E7EC;color:#475467}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.m .two{gap:14px}
.w3{flex:3 1 600px;min-width:0}.w1{flex:1 1 320px;min-width:0}
.m .w3,.m .w1{flex:1 1 100%}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:190px;align-items:end;border-bottom:1px solid #E4E7EC}
.m .chart{height:130px;gap:3px}
.bars{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:100%}
.bar{width:42%;max-width:16px;border-radius:3px 3px 0 0}
.q1{background:#C7CDF9}.q2{background:var(--a)}
.lbls{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:11px;color:#475467;text-align:center}
.m .lbls{gap:3px;font-size:10px}
.sq{width:10px;height:10px;border-radius:3px;display:inline-block}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid #F2F4F7}
.evd{flex:none;width:9px;height:9px;margin-top:5px;border-radius:999px}
.meter{height:6px;border-radius:999px;background:#F2F4F7;overflow:hidden}
.meter span{display:block;height:100%;background:var(--a)}
.itemr{display:grid;grid-template-columns:minmax(0,1fr) 76px 88px 112px 70px 112px 106px 40px;gap:8px;align-items:center;padding:10px 20px;border-top:1px solid #F2F4F7}
.m .itemr{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}
.m .span2{grid-column:span 2}
.it-n{padding:0 8px;text-align:right}
.sug{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;font:inherit;text-align:left;cursor:pointer}
.sug:hover{background:#EEF0FF}
.totl{display:flex;justify-content:space-between;gap:12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.m .board{grid-auto-columns:82%}
.bcol{background:#F2F4F7;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;align-self:start}
.ov{position:fixed;inset:0;z-index:50;background:rgba(16,24,40,.5);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto}
.m .ov{position:absolute;padding:0;align-items:flex-end}
.mod{background:#fff;border-radius:14px;width:100%;max-width:580px;display:flex;flex-direction:column}
.m .mod{border-radius:16px 16px 0 0;max-height:90%;overflow-y:auto}
.modh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #F2F4F7;gap:12px}
.modb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modf{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #F2F4F7}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;max-width:380px;padding:12px 16px;border-radius:10px;background:#101828;color:#fff;font-size:14px;font-weight:500;box-shadow:0 12px 32px rgba(16,24,40,.3)}
.m .toast{position:absolute;left:12px;right:12px;bottom:72px;max-width:none}
.auth{display:flex;min-height:inherit}
.m .auth{height:100%;overflow-y:auto;background:#fff;flex-direction:column}
.authl{flex:1 1 45%;background:var(--a);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.authr{flex:1 1 55%;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.m .authr{padding:28px 20px;align-items:flex-start}
.authb{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.pdfo{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:820px}
.m .pdfo{height:100%;max-width:none;background:#475467;overflow:auto;padding:12px 8px}
.pdfz{width:794px;flex:none}
.m .pdfz{zoom:.46}
.a4{width:794px;min-height:1123px;background:#fff;padding:0 52px 36px;display:flex;flex-direction:column;font-size:11px;line-height:1.45;color:#1D2939;box-shadow:0 8px 28px rgba(16,24,40,.25)}
.a4t{display:grid;grid-template-columns:60px minmax(0,1fr) 44px 58px 80px 44px 88px;gap:8px;padding:8px 10px;border-bottom:1px solid #EAECF0}
.lg{font-size:9px;font-weight:700;letter-spacing:.08em;color:#475467}
.pubw{max-width:680px;margin:0 auto;padding:0 16px 32px;display:flex;flex-direction:column;gap:14px}
.m .pubscroll{height:100%;overflow-y:auto}
.swt{width:36px;height:36px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.swton{border-color:#101828;outline:2px solid #fff;outline-offset:-4px}
.mat{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:8px;padding:10px 20px;border-top:1px solid #F2F4F7;font-size:13px}
.m .mat{padding:10px 14px;font-size:12px;gap:6px}
.chk{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #E4E7EC;border-radius:10px;background:#fff;font:inherit;text-align:left;cursor:pointer;width:100%}

</style>
</head>
<body>
<noscript>
<div style="max-width:420px;margin:48px auto;padding:24px;font-family:Inter,system-ui,sans-serif;color:#101828;background:#fff;border:1px solid #E4E7EC;border-radius:14px;line-height:1.5">
<p style="margin:0 0 8px;font-size:20px;font-weight:700">CotizaPro — Prototipo interactivo</p>
<p style="margin:0 0 12px;color:#344054">Esta vista previa no permite usar el prototipo. Ábrelo en un navegador web (Safari, Chrome o Edge) o desde el enlace que te compartieron.</p>
<p style="margin:0;color:#475467;font-size:14px">En un computador, descarga el archivo y ábrelo con doble clic.</p>
</div>
</noscript>
<div id="app"></div>
<script type="text/x-template" id="tpl">


<div :class="ui.rootClass" :style="ui.rootStyle">


<template v-if="ui.isAuth">
  <div class="auth">
    <aside class="authl dOnly">
      <div class="brand" style="font-size: 24px"><span class="logo" style="background: #fff; color: var(--a)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"></path></svg></span>CotizaPro</div>
      <div class="col" style="gap: 18px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 40px; line-height: 1.12; font-weight: 700">Cotiza, envía y cierra ventas desde un solo lugar.</h1>
        <p style="margin: 0; font-size: 16px; opacity: .9">Clientes, productos y cotizaciones de tu empresa, con cálculo de IVA, PDF profesional y aprobación en línea.</p>
      </div>
      <p class="sm" style="margin: 0; opacity: .8">Prototipo de demostración · Datos de ejemplo</p>
    </aside>
    <main class="authr">
      <div class="authb">
        <div class="brand mOnly"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"></path></svg></span>CotizaPro</div>

        <template v-if="ui.isLogin">
          <div class="col2"><h2 class="h1">Inicia sesión</h2><p class="sub">Entra con tu cuenta de empresa.</p></div>
          <label class="lab">Correo electrónico<input class="inp" type="email" :value="auth.email" @input="authOn.email"></label>
          <label class="lab">Contraseña<input class="inp" type="password" :value="auth.password" @input="authOn.password"></label>
          <template v-if="auth.error"><span class="err">{{auth.error}}</span></template>
          <div class="row sb"><label class="row sm" style="gap: 6px"><input type="checkbox" :checked="auth.remember" @change="authOn.remember"> Recordarme</label><button type="button" class="link" @click="go.recuperar">¿Olvidaste tu contraseña?</button></div>
          <button type="button" class="btn pri" @click="act.login">Ingresar</button>
          <p class="sub" style="text-align: center">¿Tu empresa aún no tiene cuenta? <button type="button" class="link" @click="go.registro">Registrar empresa</button></p>
        </template>

        <template v-if="ui.isRecuperar">
          <div class="col2"><h2 class="h1">Recuperar contraseña</h2><p class="sub">Te enviaremos un enlace para crear una nueva.</p></div>
          <template v-if="ui.recoverPending">
            <label class="lab">Correo electrónico<input class="inp" type="email" :value="auth.email" @input="authOn.email"></label>
            <button type="button" class="btn pri" @click="act.recover">Enviar enlace</button>
          </template>
          <template v-if="auth.recovered">
            <div class="info">Listo. Si {{auth.email}} tiene una cuenta, recibirás el enlace en unos minutos.</div>
          </template>
          <button type="button" class="link" @click="go.login">Volver a iniciar sesión</button>
        </template>

        <template v-if="ui.isRegistro">
          <div class="col2"><span class="sm mut b6">Paso {{reg.step}} de 2</span><h2 class="h1">{{ui.regTitle}}</h2></div>
          <template v-if="ui.regStep1">
            <label class="lab">RUT de la empresa<input :class="ui.regRutClass" :value="reg.rut" @input="reg.onRut" placeholder="76.123.456-7"><span :class="ui.regRutMsgClass">{{ui.regRutMsg}}</span></label>
            <label class="lab">Razón social<input class="inp" :value="reg.name" @input="regOn.name"></label>
            <label class="lab">Giro comercial<input class="inp" :value="reg.giro" @input="regOn.giro"></label>
            <label class="lab">Dirección<input class="inp" :value="reg.address" @input="regOn.address"></label>
            <div class="g2k"><label class="lab">Comuna<input class="inp" :value="reg.comuna" @input="regOn.comuna"></label><label class="lab">Ciudad<input class="inp" :value="reg.city" @input="regOn.city"></label></div>
            <div class="g2k"><label class="lab">Correo<input class="inp" type="email" :value="reg.email" @input="regOn.email"></label><label class="lab">Teléfono<input class="inp" :value="reg.phone" @input="regOn.phone"></label></div>
          </template>
          <template v-if="ui.regStep2">
            <label class="lab">Tu nombre<input class="inp" :value="reg.admin" @input="regOn.admin"></label>
            <label class="lab">Tu correo<input class="inp" type="email" :value="reg.adminEmail" @input="regOn.adminEmail"></label>
            <label class="lab">Contraseña<input class="inp" type="password" :value="reg.password" @input="regOn.password"></label>
            <div class="info">Serás el administrador de la empresa y podrás invitar a tu equipo después.</div>
          </template>
          <template v-if="reg.error"><span class="err">{{reg.error}}</span></template>
          <div class="row sb">
            <button type="button" class="btn" @click="act.regBack">Volver</button>
            <button type="button" class="btn pri" @click="act.regNext">{{ui.regCta}}</button>
          </div>
        </template>
      </div>
    </main>
  </div>
</template>

<template v-if="ui.isPublic">
  <div class="pubscroll">
    <div class="demo" style="justify-content: space-between">
      <span>Así ve tu cliente la cotización</span>
      <button type="button" class="dl" @click="act.backFromPublic">Volver al panel</button>
    </div>
    <div :style="pub.headStyle">
      <div style="max-width: 648px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">

        <div :style="pdf.bar"></div>
        <div style="display: flex; justify-content: space-between; gap: 20px">
          <div style="display: flex; gap: 14px"><template v-if="pdf.doc.co.hasLogo"><img :src="pdf.doc.co.logo" :alt="`Logotipo de ${pdf.doc.co.name ?? ''}`" style="width: 96px; height: 96px; object-fit: contain; flex: none; margin: -14px 0 -10px -8px"></template><template v-if="pdf.doc.co.noLogo"><span :style="pdf.logo">{{pdf.doc.co.initials}}</span></template><div><div style="font-size: 16px; font-weight: 700; color: #101828">{{pdf.doc.co.name}}</div><div>RUT {{pdf.doc.co.rut}}</div><div>Giro: {{pdf.doc.co.giro}}</div><div>{{pdf.doc.co.address}} · {{pdf.doc.co.comuna}}, {{pdf.doc.co.city}}</div><div>{{pdf.doc.co.phone}} · {{pdf.doc.co.email}}</div></div></div>
          <div :style="pdf.box"><div class="lg" :style="pdf.boxLabel">COTIZACIÓN</div><div class="num" style="font-size: 20px; font-weight: 700; color: #101828">N° {{pdf.doc.shortNum}}</div><div class="num" style="margin-top: 4px"><span class="mut">Emisión</span> <span class="b6">{{pdf.doc.issue}}</span></div><div class="num"><span class="mut">Válida hasta</span> <span class="b6">{{pdf.doc.due}}</span></div></div>
        </div>
        <template v-if="pdf.doc.headerText"><p style="margin: 14px 0 0; color: #344054">{{pdf.doc.headerText}}</p></template>
        <div style="margin-top: 16px; padding: 12px 16px; background: #F9FAFB; border-radius: 8px"><div class="lg" style="margin-bottom: 6px">CLIENTE</div><div style="display: flex; gap: 20px"><div style="flex: 3"><div style="font-size: 13px; font-weight: 700; color: #101828">{{pdf.doc.client.name}}</div><div>RUT {{pdf.doc.client.rut}} · Giro: {{pdf.doc.client.giro}}</div><div>{{pdf.doc.client.address}} · {{pdf.doc.client.comuna}}</div></div><div style="flex: 2"><div><span class="mut">Contacto:</span> {{pdf.doc.client.contact}}</div><div><span class="mut">Correo:</span> {{pdf.doc.client.email}}</div><div><span class="mut">Teléfono:</span> {{pdf.doc.client.phone}}</div></div></div></div>
        <div class="a4t" :style="pdf.head"><span>Código</span><span>Descripción</span><span class="right">Cant.</span><span>Unidad</span><span class="right">P. unitario</span><span class="right">Desc.</span><span class="right">Subtotal</span></div>
        <template v-for="(l, $index) in (pdf.doc.lines || [])"><div class="a4t num"><span class="mut">{{l.code}}</span><span><span style="display: block">{{l.name}}</span><template v-if="l.desc"><span class="mut" style="font-size: 10px">{{l.desc}}</span></template></span><span class="right">{{l.qty}}</span><span>{{l.unit}}</span><span class="right">{{l.price}}</span><span class="right">{{l.discTxt}}</span><span class="right b6">{{l.subtotal}}</span></div></template>
        <div style="display: flex; gap: 24px; margin-top: 18px">
          <div style="flex: 1"><div class="lg" style="margin-bottom: 4px">CONDICIONES DE PAGO</div><div style="margin-bottom: 12px">{{pdf.doc.terms}}</div><template v-if="pdf.doc.leadTime"><div class="lg" style="margin-bottom: 4px">PLAZO DE ENTREGA</div><div style="margin-bottom: 12px">{{pdf.doc.leadTime}}</div></template><div class="lg" style="margin-bottom: 4px">OBSERVACIONES</div><div style="margin-bottom: 12px">{{pdf.doc.notes}}</div><template v-if="pdf.doc.payInfo"><div :style="pdf.payBox"><div class="lg" style="margin-bottom: 4px">FORMAS DE PAGO</div><div style="white-space: pre-line">{{pdf.doc.payInfo}}</div></div></template></div>
          <div class="num" style="width: 290px; display: flex; flex-direction: column; gap: 6px">
            <div class="totl"><span class="mut">Subtotal ítems</span><span>{{pdf.doc.gross}}</span></div>
            <template v-if="pdf.doc.hasLineDisc"><div class="totl"><span class="mut">Descuentos por ítem</span><span>−{{pdf.doc.lineDisc}}</span></div></template>
            <template v-if="pdf.doc.hasGeneral"><div class="totl"><span class="mut">{{pdf.doc.generalLabel}}</span><span>−{{pdf.doc.general}}</span></div></template>
            <div class="totl b6" style="padding-top: 6px; border-top: 1px solid #EAECF0"><span>Neto</span><span>{{pdf.doc.neto}}</span></div>
            <template v-for="(t, $index) in (pdf.doc.taxLines || [])"><div class="totl"><span class="mut">{{t.label}}</span><span>{{t.amount}}</span></div></template>
            <div :style="pdf.total"><span style="font-size: 12px">TOTAL</span><span style="font-size: 16px">{{pdf.doc.total}}</span></div>
          </div>
        </div>
        <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #EAECF0; font-size: 9px; color: #475467; display: flex; flex-direction: column; gap: 3px"><div>{{pdf.doc.footerText}}</div><div class="b6">Este documento es una cotización comercial y no constituye un documento tributario.</div><div class="totl"><span>Vendedor: {{pdf.doc.seller}}</span><span>Página 1 de 1</span></div></div>
      </div></div>
    </div>
  </div>
</template>

</div>

const rutClean = (v) => String(v || '').toUpperCase().replace(/[^0-9K]/g, '');
const rutFormat = (v) => { const c = rutClean(v); if (c.length < 2) { return c; } return thousands(c.slice(0, -1).replace(/\D/g, '')) + '-' + c.slice(-1); };
const rutValid = (v) => { const c = rutClean(v); if (c.length < 8 || c.length > 9) { return false; } const b = c.slice(0, -1); return /^\d+$/.test(b) && dv(b) === c.slice(-1); };
const mkRut = (body) => rutFormat(body + dv(body));
const initials = (name) => String(name || '?').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

function calc(q) {
  let gross = 0, lineDisc = 0;
  const groups = {};
  const lines = q.items.map((it) => {
    const g = Math.round(num(it.qty) * num(it.price));
    const d = Math.round((g * Math.min(100, Math.max(0, num(it.disc)))) / 100);
    const net = g - d;
    gross += g;
    lineDisc += d;
    const key = it.taxName + '|' + it.rate;
    groups[key] = groups[key] || { name: it.taxName, rate: num(it.rate), base: 0 };
    groups[key].base += net;
    return { ...it, gross: g, discAmt: d, net };
  });
  const sub = gross - lineDisc;
  const gv = Math.max(0, num(q.gVal));
  const general = q.gType === '%' ? Math.round((sub * Math.min(100, gv)) / 100) : Math.min(Math.round(gv), sub);
  let taxTotal = 0;
  const taxLines = Object.keys(groups).map((k) => {
    const g = groups[k];
    const base = sub ? g.base - (general * g.base) / sub : 0;
    const amount = Math.round((base * g.rate) / 100);
    taxTotal += amount;
    return { label: g.rate > 0 ? g.name : g.name + ' (sin impuesto)', amount: clp(amount), rate: g.rate };
  });
  const neto = sub - general;
  return { lines, gross, lineDisc, sub, general, neto, taxTotal, taxLines, total: neto + taxTotal };
}

    const names = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    for (let i = 11; i >= 0; i--) { const d = new Date(Date.UTC(2026, 10 - i, 15)); months.push({ key: d.toISOString().slice(0, 7), label: names[d.getUTCMonth()], qv: 0, av: 0 }); }
    list.forEach((q) => {
      if (q.status === 'borrador') { return; }
      const m = months.find((x) => x.key === q.issue.slice(0, 7));
      if (m) { const t = calc(q).total; m.qv += t; if (q.status === 'aceptada') { m.av += t; } }
    });
    const max = Math.max(1, ...months.map((m) => m.qv));
    return months.map((m) => ({ label: m.label, title: m.label + ': cotizado ' + clp(m.qv) + ', aceptado ' + clp(m.av), q: 'height:' + (m.qv / max) * 100 + '%', a: 'height:' + (m.av / max) * 100 + '%' }));

  stats(list) {

    const quoted = issued.reduce((s, q) => s + calc(q).total, 0);
    const accepted = acc.reduce((s, q) => s + calc(q).total, 0);
    const rate = issued.length ? (acc.length / issued.length) * 100 : 0;
    return { total: list.length, issued: issued.length, acc: acc.length, quoted, accepted, rate, rateTxt: rate.toFixed(1).replace('.', ',') + '%', rej: list.filter((q) => q.status === 'rechazada').length };
  }
  topClients(list, n) {

        matrix: [['Clientes', 'Completo', 'Completo', 'Ver, crear y editar'], ['Productos', 'Completo', 'Completo', 'Solo ver'], ['Cotizaciones', 'Todas', 'Todas', 'Solo las propias'], ['Reportes', 'Sí', 'Sí', 'No'], ['Configuración', 'Sí', 'No', 'No'], ['Usuarios', 'Sí', 'No', 'No']].map(([mod, a, sv, v]) => ({ mod, a, s: sv, v }))
      };
    }
    if (s.config) {
      const d = st.cfg && st.cfg.id === co.id ? st.cfg : { ...co, taxes: co.taxes.map((t) => ({ ...t })) };
      const setD = (patch) => this.setState({ cfg: { ...d, ...patch } });
      const fld = (name) => (e) => setD({ [name]: e.target.value });
      const on = {};
      ['name', 'giro', 'address', 'comuna', 'city', 'email', 'phone', 'pdfHeader', 'pdfFooter', 'payInfo', 'defaultDays', 'dup', 'defaultTerms', 'defaultLead'].forEach((n) => { on[n] = fld(n); });
      const maxNumber = Math.max(0, ...st.quotes.filter((q) => q.companyId === co.id).map((q) => q.number));
      const rutU = this.rutUi(d.rut);
      const logo = 'width:56px;height:56px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;background:' + d.color;
      const setTax = (i, patch) => setD({ taxes: d.taxes.map((t, n) => (n === i ? { ...t, ...patch } : t)) });
      vals.cf = {
        d: { ...d, initials: initials(d.name) }, on, isEmpresa: st.cfgTab === 'empresa', isPdf: st.cfgTab === 'pdf', isTaxes: st.cfgTab === 'taxes', isGeneral: st.cfgTab === 'general',
        tabs: [['empresa', 'Empresa'], ['pdf', 'Documento PDF'], ['taxes', 'Impuestos'], ['general', 'General']].map(([id, label]) => ({ label, cls: 'tab' + (st.cfgTab === id ? ' tabon' : ''), pick: () => this.setState({ cfgTab: id }) })),
        rutClass: rutU.cls, rutMsg: rutU.msg, rutMsgClass: rutU.msgCls, onRut: (e) => setD({ rut: rutFormat(e.target.value) }),
        logoStyle: logo, noLogo: !d.logo, upload: () => this.say('En el sistema real aquí eliges tu logotipo'),
        nextNumber: String(num(d.seq) + 1), nextNumberTxt: 'N° ' + pad(Math.max(1, Math.round(num(d.seq) + 1)), 8),
        onNextNumber: (e) => setD({ seq: Math.max(0, Math.round(num(e.target.value)) - 1) }),
        swatches: SWATCHES.map((hex) => ({ hex, cls: 'swt' + (d.color === hex ? ' swton' : ''), style: 'background:' + hex, pick: () => setD({ color: hex }) })),
        previewBar: 'height:6px;background:' + d.color, previewBox: 'padding:6px 10px;border-radius:6px;font-size:11px;font-weight:700;color:' + d.color + ';border:2px solid ' + d.color,
        previewHead: 'display:flex;justify-content:space-between;padding:8px 10px;color:#fff;font-size:12px;font-weight:600;background:' + d.color,
        previewPdf: () => { const sample = st.quotes.find((q) => q.companyId === co.id); if (sample) { this.setState({ companies: st.companies.map((c) => (c.id === co.id ? { ...c, color: d.color, pdfHeader: d.pdfHeader, pdfFooter: d.pdfFooter } : c)), cfg: d, pdfDoc: sample.id }); } else { this.say('Crea tu primera cotización para ver el PDF'); } },
        taxes: d.taxes.map((t, i) => ({ name: t.name, rate: t.rate, isDefault: !!t.isDefault, onName: (e) => setTax(i, { name: e.target.value }), onRate: (e) => setTax(i, { rate: e.target.value }), setDefault: () => setD({ taxes: d.taxes.map((x, n) => ({ ...x, isDefault: n === i })) }) })),
        addTax: () => setD({ taxes: [...d.taxes, { id: newId('t'), name: 'Nuevo impuesto', rate: 0, isDefault: false }] }),
        save: () => {
          if (!rutValid(d.rut)) { this.setState({ cfgTab: 'empresa', toast: this.flash('Revisa el RUT de la empresa') }); return; }
          if (num(d.seq) < maxNumber) { this.setState({ cfgTab: 'general', toast: this.flash('El próximo número debe ser mayor que ' + pad(maxNumber, 8) + ', la última cotización emitida') }); return; }
          const clean = { ...d, taxes: d.taxes.map((t) => ({ ...t, rate: num(t.rate) })) };
          this.setState({ companies: st.companies.map((c) => (c.id === co.id ? clean : c)), cfg: null, toast: this.flash('Configuración guardada') });
        }
      };
    }

    vals.modal = { client: st.modal === 'client', product: st.modal === 'product', categories: st.modal === 'categories', user: st.modal === 'user', send: st.modal === 'send', confirm: st.modal === 'confirm' };
    if (vals.modal.client && st.clientForm) {
      const f = st.clientForm;
      const u = this.rutUi(f.rut, f.type === 'Persona' ? 'Opcional para personas' : 'Formato: 76.123.456-7');
      const dupC = u.ok ? clients.find((c) => c.id !== f.id && rutClean(c.rut) === rutClean(f.rut)) : null;
      const blockDup = !!dupC && co.dup === 'rut';
      const hasQuotes = f.id && st.quotes.some((q) => q.clientId === f.id);
      vals.cm = {
        f, on: this.fields('clientForm', ['name', 'giro', 'address', 'comuna', 'city', 'email', 'phone', 'contact', 'notes']), title: f.id ? 'Editar cliente' : 'Nuevo cliente', nameLabel: f.type === 'Empresa' ? 'Razón social' : 'Nombre completo',
        empClass: 'btn' + (f.type === 'Empresa' ? ' pri' : ''), perClass: 'btn' + (f.type === 'Persona' ? ' pri' : ''), setEmpresa: () => this.setState({ clientForm: { ...f, type: 'Empresa' } }), setPersona: () => this.setState({ clientForm: { ...f, type: 'Persona' } }),
        rutClass: u.cls, rutMsg: u.msg, rutMsgClass: u.msgCls, onRut: (e) => this.setState({ clientForm: { ...this.state.clientForm, rut: rutFormat(e.target.value), error: '' } }),
        dupMsg: dupC ? 'Ya existe un cliente con este RUT: ' + dupC.name + '.' + (blockDup ? ' No se puede duplicar.' : ' Puedes guardarlo igualmente.') : '', blocked: blockDup,
        canDelete: !!f.id && !hasQuotes && perm.clientsToggle,
        del: () => this.setState({ clients: st.clients.filter((c) => c.id !== f.id), modal: null, screen: 'clientes', toast: this.flash('Cliente eliminado') }),
        save: () => this.saveClient()
      };
    }
    if (vals.modal.product && st.productForm) {
      vals.pm = { f: st.productForm, on: this.fields('productForm', ['code', 'type', 'name', 'desc', 'catId', 'unit', 'price', 'taxId']), title: st.productForm.id ? 'Editar ítem' : 'Nuevo producto o servicio', isEdit: !!st.productForm.id, save: () => this.saveProduct() };
    }
    if (vals.modal.categories) {
      vals.catm = { name: st.catName, onName: (e) => this.setState({ catName: e.target.value }), rows: cats.map((c) => ({ name: c.name, count: products.filter((p) => p.catId === c.id).length })), add: () => { const nm = st.catName.trim(); if (!nm) { return; } if (cats.some((c) => c.name.toLowerCase() === nm.toLowerCase())) { this.say('Esa categoría ya existe'); return; } this.setState({ categories: [...st.categories, { id: newId('g'), companyId: st.companyId, name: nm }], catName: '', toast: this.flash('Categoría agregada') }); } };
    }
    if (vals.modal.user && st.userForm) {
      const f = st.userForm;
      vals.um = { f, on: this.fields('userForm', ['name', 'email', 'role']), save: () => { if (!f.name.trim() || !f.email.trim()) { this.setState({ userForm: { ...f, error: 'Ingresa nombre y correo.' } }); return; } if (st.users.some((u) => u.email.toLowerCase() === f.email.trim().toLowerCase())) { this.setState({ userForm: { ...f, error: 'Ya existe un usuario con ese correo.' } }); return; } this.setState({ users: [...st.users, { id: newId('u'), companyId: st.companyId, name: f.name, email: f.email, role: f.role, active: true }], modal: null, toast: this.flash('Invitación enviada a ' + f.email) }); } };
    }
    if (vals.modal.send && st.sendForm) {
      const q = st.quotes.find((x) => x.id === st.sendForm.id);
      vals.sm = { f: st.sendForm, on: this.fields('sendForm', ['to', 'subject', 'body']), num: q ? quoteNum(q) : '', confirm: () => this.confirmSend() };
    }
    if (vals.modal.confirm && st.confirm) {
      vals.cfm = { title: st.confirm.title, text: st.confirm.text, label: st.confirm.label, cls: 'btn ' + (st.confirm.danger ? 'rej' : 'pri'), run: () => { const run = this.state.confirm.run; this.setState({ modal: null, confirm: null }); run(); } };
    }

    if (ui.isPublic && st.pub) {
      const q = st.quotes.find((x) => x.id === st.pub.qid);
      const doc = this.docVM(q);
      const p = st.pub;
      const expired = q.status === 'vencida' || diffDays(q.due, TODAY) < 0;
      const answered = q.status === 'aceptada' || q.status === 'rechazada';
      const can = !expired && !answered;
      vals.pub = {
        doc, form: p, on: { name: this.field('pub', 'name'), contact: this.field('pub', 'contact'), note: this.field('pub', 'note') },
        headStyle: 'background:' + doc.color + ';color:#fff;padding:20px 16px 68px',
        logoStyle: 'width:36px;height:36px;flex:none;border-radius:8px;background:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;color:' + doc.color,
        badge: answered ? (q.status === 'aceptada' ? 'Aceptada el ' : 'Rechazada el ') + fmtDT(q.respondedAt) : expired ? 'Vencida' : 'Esperando tu respuesta',
        badgeClass: 'badge b-' + (answered ? q.status : expired ? 'vencida' : 'visualizada'),
        openPdf: () => this.setState({ pdfDoc: q.id }), canRespond: can, showForm: can && !!p.mode,
        acceptClass: 'btn' + (p.mode === 'accept' ? ' ok' : ''), rejectClass: 'btn' + (p.mode === 'reject' ? ' rej' : ''),
        chooseAccept: () => this.setState({ pub: { ...this.state.pub, mode: 'accept', error: '' } }), chooseReject: () => this.setState({ pub: { ...this.state.pub, mode: 'reject', error: '' } }),
        noteLabel: p.mode === 'reject' ? 'Motivo del rechazo (opcional)' : 'Comentarios (opcional)', confirmLabel: p.mode === 'reject' ? 'Confirmar rechazo' : 'Confirmar aceptación', confirmClass: 'btn ' + (p.mode === 'reject' ? 'rej' : 'ok'), confirm: () => this.respond(),
        closedMsg: answered ? (q.status === 'aceptada' ? '¡Gracias! Tu aceptación quedó registrada' : 'Tu respuesta quedó registrada') : expired ? 'Esta cotización venció' : '',
        closedSub: answered ? doc.co.name + ' ya fue notificada. Esta cotización no admite otra respuesta.' : 'Contacta a ' + doc.co.name + ' para solicitar una actualización.'
      };
    }

    const pdfQ = st.pdfDoc ? (typeof st.pdfDoc === 'string' ? st.quotes.find((x) => x.id === st.pdfDoc) : st.pdfDoc) : null;
    vals.pdf = { open: !!pdfQ };
    if (pdfQ) {
      const doc = this.docVM(pdfQ);
      vals.pdf = {
        open: true, doc, close: () => this.setState({ pdfDoc: null }), download: () => this.say('Descargando ' + doc.fileName),
        bar: 'height:6px;margin:0 -52px 30px;background:' + doc.color,
        logo: 'width:60px;height:60px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;background:' + doc.color,
        box: 'flex:none;border-radius:8px;padding:12px 16px;min-width:200px;border:2px solid ' + doc.color, boxLabel: 'color:' + doc.color,
        payBox: 'padding:10px 12px;border-radius:8px;background:#F9FAFB;border-left:3px solid ' + doc.color,
        head: 'margin-top:20px;border-bottom:0;font-size:10px;font-weight:600;color:#fff;background:' + doc.color,
        total: 'display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:10px 12px;border-radius:6px;font-weight:700;color:#fff;background:' + doc.color
      };
    }
    return vals;
  }
}

(function () {
  const { createApp, reactive, computed, onMounted, watch } = Vue;
  const phone = new URLSearchParams(location.search).has('movil');
  if (phone) { document.body.classList.add('phone'); }
  const comp = new Component({ device: phone ? 'movil' : 'auto', accent: '#0A6EA6' });
  comp.state = reactive(comp.state);
  const vals = computed(() => comp.renderVals());
  const KEYS = ["accent","ui","go","act","s","me","perm","navItems","moreItems","bottomItems","clientOptions","activeClientOptions","userOptions","catOptions","taxOptions","statusOptions","companyOptions","unitOptions","notif","authOn","auth","reg","regOn","dash","ql","ed","det","seg","cl","cd","pr","rp","us","cf","modal","cm","pm","catm","um","sm","cfm","pub","pdf"];
  createApp({
    template: '#tpl',
    setup() {
      const ctx = {};
      KEYS.forEach((k) => { ctx[k] = computed(() => { const v = vals.value[k]; return v === undefined || v === null ? {} : v; }); });
      onMounted(() => comp.componentDidMount());
      watch(() => [comp.state.screen, comp.state.view], () => {
        window.scrollTo(0, 0);
        const el = document.querySelector('[data-scroll]');
        if (el) { el.scrollTop = 0; }
      });
      return ctx;
    }
  }).mount('#app');
})();
</script>
